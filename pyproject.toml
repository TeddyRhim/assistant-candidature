[project]
name = "assistant-candidatures"
version = "0.1.0"
description = "Assistant local de recherche d'emploi et de préparation de candidatures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pypdf>=4.2,<6",
    "python-docx>=1.1,<2",
    "certifi>=2024.2.2",
    "langdetect>=1.0.9,<2",
    "jinja2>=3.1",
    "reportlab>=4.2,<5",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.35,<2",
    "weasyprint>=62",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
